# MSA-style local topology for Gaesup frontend containers.
#
# Each slot service is intentionally small: it exposes one frontend container
# manifest over HTTP, like an independently deployed unit. The host shell reads
# the registry/release plan first, validates manifests, then mounts containers.
services:
  slot-registry:
    image: nginx:1.27-alpine
    ports:
      - "5000:80"
    volumes:
      - ../examples/monorepo-containers:/usr/share/nginx/html:ro
    labels:
      gaesup.role: "slot-registry"
      gaesup.release: "web-2026-04-28.1"
    networks:
      - gaesup-msa

  shell-wasm-state:
    image: nginx:1.27-alpine
    ports:
      - "5101:80"
    volumes:
      - ../examples/monorepo-containers/containers/shell/manifest.json:/usr/share/nginx/html/manifest.json:ro
    labels:
      gaesup.role: "frontend-container"
      gaesup.slot: "shell"
      gaesup.runtime: "wasm-state-contract"
      gaesup.release: "web-2026-04-28.1"
    networks:
      - gaesup-msa

  header-wasm-state:
    image: nginx:1.27-alpine
    ports:
      - "5102:80"
    volumes:
      - ../examples/monorepo-containers/containers/header/manifest.json:/usr/share/nginx/html/manifest.json:ro
    labels:
      gaesup.role: "frontend-container"
      gaesup.slot: "header"
      gaesup.runtime: "wasm-state-contract"
      gaesup.release: "web-2026-04-28.1"
    networks:
      - gaesup-msa

  body-wasm-state:
    image: nginx:1.27-alpine
    ports:
      - "5103:80"
    volumes:
      - ../examples/monorepo-containers/containers/body/manifest.json:/usr/share/nginx/html/manifest.json:ro
    labels:
      gaesup.role: "frontend-container"
      gaesup.slot: "body"
      gaesup.runtime: "wasm-state-contract"
      gaesup.release: "web-2026-04-28.1"
    networks:
      - gaesup-msa

  sidebar-wasm-state:
    image: nginx:1.27-alpine
    ports:
      - "5104:80"
    volumes:
      - ../examples/monorepo-containers/containers/sidebar/manifest.json:/usr/share/nginx/html/manifest.json:ro
    labels:
      gaesup.role: "frontend-container"
      gaesup.slot: "sidebar"
      gaesup.runtime: "wasm-state-contract"
      gaesup.release: "web-2026-04-28.1"
    networks:
      - gaesup-msa

  contract-validator:
    image: node:20-bookworm
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@8.10.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter gaesup-state-core-rust run build:node &&
      pnpm --filter @gaesup-example/monorepo-containers run validate"
    volumes:
      - ..:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      - slot-registry
      - shell-wasm-state
      - header-wasm-state
      - body-wasm-state
      - sidebar-wasm-state
    profiles:
      - validate
    networks:
      - gaesup-msa

  host-shell:
    image: node:20-bookworm
    working_dir: /workspace
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@8.10.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm run build:wasm &&
      pnpm --filter @gaesup-state/multi-framework-demo run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      VITE_GAESUP_RELEASE_PLAN_URL: "http://slot-registry/release-plan.json"
      VITE_GAESUP_SLOT_REGISTRY_URL: "http://slot-registry"
      VITE_GAESUP_SHELL_MANIFEST_URL: "http://shell-wasm-state/manifest.json"
      VITE_GAESUP_HEADER_MANIFEST_URL: "http://header-wasm-state/manifest.json"
      VITE_GAESUP_BODY_MANIFEST_URL: "http://body-wasm-state/manifest.json"
      VITE_GAESUP_SIDEBAR_MANIFEST_URL: "http://sidebar-wasm-state/manifest.json"
    volumes:
      - ..:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      - slot-registry
      - shell-wasm-state
      - header-wasm-state
      - body-wasm-state
      - sidebar-wasm-state
    networks:
      - gaesup-msa

networks:
  gaesup-msa:
    driver: bridge

volumes:
  pnpm-store:
