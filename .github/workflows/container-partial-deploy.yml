name: Container Partial Deployment Guard

on:
  pull_request:
    paths:
      - 'examples/monorepo-containers/**'
      - 'packages/core-rust/**'
      - 'packages/core/**'
      - '.github/workflows/container-partial-deploy.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'examples/monorepo-containers/**'
      - 'packages/core-rust/**'
      - 'packages/core/**'
      - '.github/workflows/container-partial-deploy.yml'

jobs:
  detect:
    name: Detect affected containers
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.changed.outputs.containers }}
      has_changes: ${{ steps.changed.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed container slots
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm --filter @gaesup-example/monorepo-containers run changed -- --base "$BASE_SHA" --head "$HEAD_SHA"

  validate:
    name: Validate affected container
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.detect.outputs.containers) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM validator package
        run: pnpm --filter gaesup-state-core-rust run build

      - name: Validate container contract
        run: pnpm --filter @gaesup-example/monorepo-containers run validate:affected -- --containers '${{ matrix.container }}'

      - name: Verify affected artifact
        run: pnpm --filter @gaesup-example/monorepo-containers run deploy:affected -- --dry-run --containers '${{ matrix.container }}'

      - name: Update registry slot pointer
        if: github.event_name == 'push'
        run: pnpm --filter @gaesup-example/monorepo-containers run deploy:affected -- --containers '${{ matrix.container }}'

      - name: Upload registry artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: container-registry-${{ matrix.container }}
          path: examples/monorepo-containers/dist/registry.json
