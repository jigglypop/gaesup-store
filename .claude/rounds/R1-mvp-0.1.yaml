# R1 라운드 계약 — Runtime Spec v0.1, MVP 0.1
# 스펙 근거: docs/runtime-spec-v0.1.md §15–20(State Plane/Graph), §6–14(Container/
# Expose·Consume), §10(Lifecycle), §32–33(React), §69–70(예제), §83(Invariants), §84(MVP 0.1)

round: "R1: MVP 0.1 — container runtime core"
goal: >
  defineContainer / createRuntime / state / derived / expose / consume / React Adapter.
  수용 시나리오(§84): auth가 user를 expose, dashboard가 auth.user를 consume,
  auth.user 변경 → dashboard derived 갱신 → DashboardView만 rerender.

packages:                     # G0 allowlist — 이 밖의 변경은 실패
  - packages/gaesup-core      # npm: @gaesup/core   (graph, scheduler, lifecycle, errors, types)
  - packages/gaesup-store     # npm: @gaesup/store  (state, derived, batch)
  - packages/gaesup-runtime   # npm: @gaesup/runtime (defineContainer, createRuntime, resolver)
  - packages/gaesup-react     # npm: @gaesup/react  (useGaesup, RuntimeProvider, useContainer)
  # 허용 부수 변경: pnpm-lock.yaml (신규 패키지 install), pnpm-workspace.yaml 불변(packages/* 매칭)

error_codes:                  # G3 감사 대상 — TS 소스 + 테스트 assertion 동시 존재 필수
  - GAESUP_DEPENDENCY_CYCLE        # I3: consume 그래프 cycle (§13)
  - GAESUP_CONSUME_NOT_EXPOSED     # I1: expose 안 된 노드 consume
  - GAESUP_CONTAINER_NOT_FOUND     # 미등록 container consume/start/get
  - GAESUP_DUPLICATE_CONTAINER     # 동일 name 중복 register
  - GAESUP_INVALID_TRANSITION      # I5: 정의 밖 lifecycle 전이
  - GAESUP_READONLY_NODE           # I2: consume한 노드에 set 시도

audit_events: []              # 이번 라운드 없음 (trace는 MVP 이후)

api_surface:
  "@gaesup/core":
    - "class GaesupError extends Error { readonly code: GaesupErrorCode }  // code는 위 6종 union"
    - "type ContainerStatus = 'CREATED'|'RESOLVING'|'READY'|'STARTING'|'ACTIVE'|'SUSPENDED'|'STOPPING'|'STOPPED'|'FAILED'|'DESTROYED'"
    - "canTransition(from: ContainerStatus, to: ContainerStatus): boolean  // §10 정상 흐름 + (any)->FAILED, FAILED->DESTROYED"
    - "assertTransition(from, to): void  // 불허 시 GaesupError(GAESUP_INVALID_TRANSITION)"
    - "batch(fn: () => void): void  // §20 — batch 내 다중 set은 구독자에게 1회만 통지"
    - "내부: reactive graph (dirty propagation, topo recompute, auto dependency tracking) — WASM 이전 가능한 순수 로직(§61), DOM/React 의존 금지(I8)"
  "@gaesup/store":
    - "state<T>(initial: T): StateNode<T>  // .get(): T, .set(v: T): void, .subscribe(fn: () => void): () => void, .version: number(단조 증가, §64)"
    - "derived<T>(compute: () => T): DerivedNode<T>  // .get(), .subscribe() — 의존성 자동 수집(§17), 의존 노드 변경 시에만 재계산(§19)"
  "@gaesup/runtime":
    - "defineContainer(def: { name: string; setup(ctx: { consume<T>(address: string): ConsumedNode<T> }): SetupResult }): ContainerDefinition"
    - "SetupResult = { state?: Record<string, StateNode|DerivedNode>; exposes?: Record<string, StateNode|DerivedNode> }"
    - "createRuntime(opts?: { containers?: ContainerDefinition[] }): GaesupRuntime"
    - "runtime.register(def): void  // 중복 name → GAESUP_DUPLICATE_CONTAINER"
    - "runtime.start(name?): Promise<void>  // 인자 없으면 전체를 topo 순서로(§73–74). consume 해석은 start 시점"
    - "runtime.stop(name): Promise<void>"
    - "runtime.get(name): { name, status: ContainerStatus, exposes: Record<string, ConsumedNode> }  // 미등록 → GAESUP_CONTAINER_NOT_FOUND"
    - "runtime.containers(): Array<{ name: string; status: ContainerStatus }>"
    - "ConsumedNode<T> = { get(): T; subscribe(fn): () => void }  // set 없음. set 강제 시도 → GAESUP_READONLY_NODE (I2)"
    - "address 형식: '<container>.<exposedKey>' (§8)"
  "@gaesup/react":
    - "RuntimeProvider({ runtime, children })"
    - "useGaesup<T>(node: { get(): T; subscribe(fn: () => void): () => void }): T  // useSyncExternalStore 기반(§32)"
    - "useContainer(name: string): { status, exposes }  // Provider의 runtime에서 조회"

fail_paths:                   # 각각 최소 1개 거부 테스트 (G3)
  - "consume 그래프에 cycle (a→b→a) → start 시 GAESUP_DEPENDENCY_CYCLE, 어떤 container도 ACTIVE 되지 않음"
  - "expose 안 된 내부 state를 consume → GAESUP_CONSUME_NOT_EXPOSED"
  - "미등록 container 주소 consume → GAESUP_CONTAINER_NOT_FOUND"
  - "runtime.get('없는이름') → GAESUP_CONTAINER_NOT_FOUND"
  - "같은 name 두 번 register → GAESUP_DUPLICATE_CONTAINER"
  - "STOPPED → ACTIVE 직접 전이 등 정의 밖 전이 → GAESUP_INVALID_TRANSITION"
  - "consume한 노드에 (as any).set(...) → GAESUP_READONLY_NODE"

invariants_under_test:        # 스펙 §83
  - "I1/I2: expose·consume 격리 (위 fail_paths)"
  - "I3: cycle 금지"
  - "I5: lifecycle 전이표"
  - "I8: @gaesup/core·store·runtime의 소스와 dependencies에 react 부재 (verifier가 grep으로 확인)"
  - "§84: dashboard derived 갱신 시 AuthView는 rerender되지 않음 (render count assertion)"
  - "§33: React unmount 후에도 container는 ACTIVE 유지, remount 시 최신 상태 표시"
  - "§20: batch 내 다중 set → 구독자 통지 1회"
  - "§17/19: 무관한 state 변경 시 derived compute 함수 재실행 없음 (compute count assertion)"

allowed_new_deps:             # dev/test-writer에 명시 승인
  - "packages/gaesup-react: peerDependencies react>=18; devDependencies react, react-dom, @testing-library/react, jsdom (테스트 전용)"
  - "그 외 패키지: 신규 runtime dependency 0 (workspace 내부 @gaesup/* 상호 참조만 허용)"

bench_sensitive: false
docs: []                      # R1은 저널만 (HARNESS.md). 공개 문서는 0.2에서
forbidden:
  - "기존 packages/{core,core-rust,adapter,registry,frameworks}/** 수정 금지 (구 제품, 보존)"
  - "루트 tsconfig.json의 기존 paths 수정 금지 (신규 paths 추가는 허용)"
  - "@gaesup/core·store·runtime에 react import (I8)"
